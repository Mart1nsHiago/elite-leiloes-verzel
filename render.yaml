services:
  - type: web
    name: elite-leiloes-verzel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elite-leiloes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: PYTHONUNBUFFERED
        value: '1'
databases:
  - name: elite-leiloes-db
    databaseName: elite_leiloes
    user: elite_user
    plan: free
